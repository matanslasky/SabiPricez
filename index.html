<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F5132" />
  <title>SabiPricez · Tel Aviv Grocery Intelligence</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --surface-subtle: #F2F2EE;
      --border: #EAEAE6;
      --border-strong: #DCDCD6;
      --ink: #14171A;
      --ink-secondary: #525866;
      --ink-muted: #717784;
      --brand: #0F5132;
      --brand-hover: #0B3D26;
      --emerald: #10B981;
      --emerald-bg: #ECFDF5;
      --emerald-border: #A7F3D0;
      --emerald-ink: #065F46;
      --amber-bg: #FEF3C7;
      --amber-ink: #92400E;
      --amber-border: #FDE68A;
      --radius-card: 16px;
      --radius-row: 12px;
      --radius-pill: 999px;
      --shadow-card: 0 2px 8px rgba(20, 23, 26, 0.04);
      --shadow-dock: 0 -4px 20px rgba(20, 23, 26, 0.06);
      --font-sans: 'Plus Jakarta Sans', 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
      padding-bottom: calc(136px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* Frosted Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 247, 245, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.03em;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .freshness-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .freshness-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      flex-shrink: 0;
    }

    .freshness-pill.stale .freshness-dot {
      background: #F59E0B;
    }

    .freshness-pill.stale {
      background: var(--amber-bg);
      color: var(--amber-ink);
      border-color: var(--amber-border);
    }

    /* Main Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px 24px;
    }

    /* Quick Filter Bar (Deals / Lows / Store Focus) */
    .quick-toggles {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }
    .quick-toggles::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .chip.active {
      background: var(--brand);
      color: #FFFFFF;
      border-color: var(--brand);
    }

    /* Product Cards */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 16px;
      transition: border-color 0.15s ease;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title-group {
      min-width: 0;
    }

    .card-cat {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .low-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--emerald-bg);
      color: var(--emerald-ink);
      border: 1px solid var(--emerald-border);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    /* Stepper Control */
    .stepper {
      display: inline-flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 2px;
    }

    .stepper-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: var(--surface);
      color: var(--ink);
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .stepper-btn:active {
      transform: scale(0.92);
    }

    .stepper-btn.add-primary {
      background: var(--brand);
      color: #fff;
    }

    .stepper-qty {
      min-width: 28px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--ink);
    }

    /* RTL Match Rows */
    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      direction: rtl;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-row);
      background: var(--bg);
      border: 1px solid transparent;
    }

    .match-row.winner {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      border-right: 4px solid var(--emerald);
    }

    .match-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .match-top-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Muted Brand-Tinted Store Pills */
    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .store-rami { background: #EFF6FF; color: #1D4ED8; }
    .store-osher { background: #FFF7ED; color: #C2410C; }
    .store-shufersal { background: #FEF2F2; color: #B91C1C; }
    .store-ampm { background: #F0FDF4; color: #15803D; }
    .store-default { background: #F1F5F9; color: #334155; }

    .winner-tag {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--emerald-ink);
      background: rgba(16, 185, 129, 0.16);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .walk-tag {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .product-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .promo-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .promo-pill.active-deal {
      background: var(--amber-bg);
      color: var(--amber-ink);
      border: 1px solid var(--amber-border);
    }

    .promo-pill.info-deal {
      background: #F1F5F9;
      color: var(--ink-secondary);
    }

    /* 3-Tier Price Hierarchy */
    .price-col {
      text-align: left;
      direction: ltr;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .price-hero {
      font-size: 19px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .match-row.winner .price-hero {
      color: var(--brand);
    }

    .price-unit {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .price-sub {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .price-strike {
      text-decoration: line-through;
      color: #9CA3AF;
      margin-right: 4px;
    }

    /* Progressive Disclosure Toggle */
    .expand-btn {
      margin-top: 10px;
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .expand-btn:hover {
      background: var(--surface-subtle);
    }

    /* Bottom Thumb-Zone Dock */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(247, 247, 245, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow-dock);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    }

    .dock-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-strip::-webkit-scrollbar { display: none; }

    .cat-pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-pill.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .dock-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      padding: 0 34px 0 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--brand);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: var(--surface-subtle);
      color: var(--ink-secondary);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      place-items: center;
    }

    .basket-fab {
      height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: none;
      background: var(--brand);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(15, 81, 50, 0.25);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .basket-fab:active {
      transform: scale(0.97);
    }

    .basket-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 800;
    }

    /* Smart Basket Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 23, 26, 0.45);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      background: var(--bg);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.18);
    }

    .drawer-header {
      background: var(--surface);
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .icon-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--ink);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    /* Mode Segmented Control */
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-subtle);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 9px;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--brand);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .drawer-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* Store Selector & Callout */
    .store-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .store-tabs::-webkit-scrollbar { display: none; }

    .store-tab {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 8px 12px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      min-width: 126px;
      flex-shrink: 0;
    }

    .store-tab.active {
      border-color: var(--brand);
      background: var(--emerald-bg);
    }

    .store-tab-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .store-tab-total {
      font-size: 15px;
      font-weight: 800;
      color: var(--brand);
      margin-top: 2px;
    }

    .callout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--ink-secondary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .callout-highlight {
      color: var(--brand);
      font-weight: 700;
    }

    /* Custom Free-Text Item Adder */
    .custom-add-form {
      display: flex;
      gap: 6px;
      background: var(--surface);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .custom-name-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .custom-price-input {
      width: 74px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .custom-add-btn {
      border: none;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Basket Item Rows (Plan & In-Aisle) */
    .basket-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .basket-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .basket-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .basket-item-meta {
      min-width: 0;
      flex: 1;
    }

    .basket-item-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .basket-item-he {
      font-size: 12.5px;
      color: var(--ink-secondary);
      direction: rtl;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .nudge-pill {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--amber-bg);
      color: var(--amber-ink);
      border: 1px solid var(--amber-border);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    /* In-Aisle Checklist Row */
    .aisle-progress {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .aisle-progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-track {
      height: 8px;
      background: var(--surface-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--emerald);
      transition: width 0.2s ease;
    }

    .aisle-row {
      min-height: 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .aisle-row.checked {
      opacity: 0.52;
      background: var(--surface-subtle);
    }

    .aisle-check {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      background: var(--surface);
    }

    .aisle-row.checked .aisle-check {
      background: var(--emerald);
      border-color: var(--emerald);
    }

    .aisle-row.checked .aisle-name {
      text-decoration: line-through;
    }

    .drawer-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-whatsapp {
      flex: 2;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: #16A34A;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--ink-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">
          <img src="logo.jpg" alt="SabiPricez" onerror="this.remove(); this.parentElement.textContent='S';" />
        </div>
        <div>
          <div class="brand-title">SabiPricez</div>
          <div class="brand-sub">Tel Aviv Grocery Price Intelligence</div>
        </div>
      </div>
      <div id="freshnessPill" class="freshness-pill">
        <span class="freshness-dot"></span>
        <span id="freshnessText">Loading...</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="quick-toggles">
      <button class="chip" id="toggleDeals" onclick="toggleFilter('deals')">🏷️ Active Promos</button>
      <button class="chip" id="toggleLows" onclick="toggleFilter('lows')">📉 30-Day Lows</button>
      <button class="chip" id="toggleWalkOnly" onclick="toggleFilter('walk')">🚶 Walkable Only</button>
    </div>

    <div id="cardsGrid" class="cards-grid">
      <div class="empty-state">Loading live supermarket prices...</div>
    </div>
  </main>

  <!-- Bottom Thumb-Zone Action Dock -->
  <div class="bottom-dock">
    <div class="dock-inner">
      <div id="catStrip" class="cat-strip"></div>
      <div class="dock-controls">
        <div class="search-box">
          <input id="searchInput" class="search-input" type="text" placeholder="Search English or עברית..." oninput="onSearchInput()" />
          <button id="searchClear" class="search-clear" onclick="clearSearch()" aria-label="Clear search">✕</button>
        </div>
        <button class="basket-fab" onclick="openBasket()">
          <span>Basket</span>
          <span id="basketCountBadge" class="basket-count num">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Smart Basket & In-Aisle Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="handleBackdropClick(event)">
    <div class="drawer" role="dialog" aria-modal="true">
      <div class="drawer-header">
        <div class="drawer-top-row">
          <div class="drawer-title">Smart Basket</div>
          <button class="icon-close" onclick="closeBasket()" aria-label="Close">✕</button>
        </div>
        <div class="mode-switch">
          <button id="modePlanBtn" class="mode-btn active" onclick="setBasketMode('plan')">🏠 Plan at Home</button>
          <button id="modeAisleBtn" class="mode-btn" onclick="setBasketMode('aisle')">🛒 Shop in Aisle</button>
        </div>
      </div>

      <div id="drawerBody" class="drawer-body"></div>

      <div class="drawer-footer">
        <button class="btn-secondary" onclick="clearBasket()">Clear</button>
        <button class="btn-whatsapp" onclick="shareWhatsApp()">Share to WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    let appData = { updated_at: "", stores: [], items: [] };
    let state = {
      category: "All",
      search: "",
      onlyDeals: false,
      onlyLows: false,
      walkOnly: false,
      expanded: {},
      basket: JSON.parse(localStorage.getItem("sabipricez_basket_v2") || "{}"),
      customItems: JSON.parse(localStorage.getItem("sabipricez_custom_v1") || "[]"),
      checkedIds: JSON.parse(localStorage.getItem("sabipricez_checked_v1") || "{}"),
      selectedStore: null,
      basketMode: "plan"
    };

    function saveState() {
      localStorage.setItem("sabipricez_basket_v2", JSON.stringify(state.basket));
      localStorage.setItem("sabipricez_custom_v1", JSON.stringify(state.customItems));
      localStorage.setItem("sabipricez_checked_v1", JSON.stringify(state.checkedIds));
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """);
    }

    function getStoreMeta(shortStore, fullStore) {
      const s = (shortStore || fullStore || "").toLowerCase();
      const storeObj = appData.stores.find(st => st.label === fullStore || st.short_name === shortStore);
      const isWalk = storeObj ? storeObj.tier === "neighborhood" : (s.includes("בן יהודה") || s.includes("שופרסל שלי") || s.includes("am:pm"));
      let cls = "store-default";
      if (s.includes("רמי לוי")) cls = "store-rami";
      else if (s.includes("אושר עד")) cls = "store-osher";
      else if (s.includes("שופרסל")) cls = "store-shufersal";
      else if (s.includes("am:pm")) cls = "store-ampm";
      return { cls, isWalk, icon: isWalk ? "🚶" : "🚗" };
    }

    function updateFreshness(updatedAt) {
      const pill = document.getElementById("freshnessPill");
      const text = document.getElementById("freshnessText");
      if (!updatedAt) {
        text.textContent = "Offline snapshot";
        return;
      }
      const parsed = new Date(updatedAt.replace(" ", "T") + "+02:00");
      if (isNaN(parsed.getTime())) {
        text.textContent = updatedAt;
        return;
      }
      const diffHrs = Math.max(0, Math.round((Date.now() - parsed.getTime()) / 3600000));
      if (diffHrs < 1) {
        text.textContent = "Updated just now · Live";
        pill.classList.remove("stale");
      } else if (diffHrs <= 24) {
        text.textContent = `Updated ${diffHrs}h ago · Live`;
        pill.classList.remove("stale");
      } else {
        const days = Math.floor(diffHrs / 24);
        text.textContent = `Updated ${days}d ago`;
        pill.classList.add("stale");
      }
    }

    function renderCategories() {
      const cats = ["All", ...new Set(appData.items.map(i => i.category))];
      const strip = document.getElementById("catStrip");
      strip.innerHTML = cats.map(c => `
        <button class="cat-pill ${state.category === c ? "active" : ""}" onclick="setCategory('${escapeHtml(c)}')">
          ${escapeHtml(c)}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      state.category = cat;
      renderCategories();
      renderCards();
    }

    function toggleFilter(type) {
      if (type === "deals") state.onlyDeals = !state.onlyDeals;
      if (type === "lows") state.onlyLows = !state.onlyLows;
      if (type === "walk") state.walkOnly = !state.walkOnly;
      document.getElementById("toggleDeals").classList.toggle("active", state.onlyDeals);
      document.getElementById("toggleLows").classList.toggle("active", state.onlyLows);
      document.getElementById("toggleWalkOnly").classList.toggle("active", state.walkOnly);
      renderCards();
    }

    function onSearchInput() {
      const input = document.getElementById("searchInput");
      state.search = input.value.trim().toLowerCase();
      document.getElementById("searchClear").style.display = state.search ? "grid" : "none";
      renderCards();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      onSearchInput();
    }

    function toggleExpand(itemName) {
      state.expanded[itemName] = !state.expanded[itemName];
      renderCards();
    }

    function changeQty(itemName, delta) {
      const curr = state.basket[itemName] || 0;
      const next = Math.max(0, curr + delta);
      if (next === 0) {
        delete state.basket[itemName];
        delete state.checkedIds["staple:" + itemName];
      } else {
        state.basket[itemName] = next;
      }
      saveState();
      updateBasketBadge();
      renderCards();
      if (document.getElementById("drawerBackdrop").classList.contains("open")) {
        renderBasketDrawer();
      }
    }

    function setExactQty(itemName, qty) {
      state.basket[itemName] = qty;
      saveState();
      updateBasketBadge();
      renderCards();
      renderBasketDrawer();
    }

    function updateBasketBadge() {
      const stapleCount = Object.values(state.basket).reduce((a, b) => a + b, 0);
      const customCount = state.customItems.reduce((a, b) => a + (b.qty || 1), 0);
      document.getElementById("basketCountBadge").textContent = stapleCount + customCount;
    }

    function renderMatchRow(m, idx, isWinner, isWalkHighlight) {
      const meta = getStoreMeta(m.short_store, m.store);
      const hasDiscount = m.effective_unit_price < m.unit_price - 0.01;
      const promoHtml = m.promo
        ? `<div class="promo-pill ${m.promo.promo_unit_price ? "active-deal" : "info-deal"}">
             ${m.promo.promo_unit_price ? "🏷️" : "ℹ️"} ${escapeHtml(m.promo.desc)}
           </div>`
        : "";

      return `
        <div class="match-row ${isWinner ? "winner" : ""}">
          <div class="match-info">
            <div class="match-top-line">
              <span class="store-pill ${meta.cls}">${meta.icon} ${escapeHtml(m.short_store || m.store)}</span>
              ${isWinner ? `<span class="winner-tag">#1 Best</span>` : ""}
              ${!isWinner && isWalkHighlight ? `<span class="walk-tag">Best Walk</span>` : ""}
            </div>
            <div class="product-name" title="${escapeHtml(m.product)}">${escapeHtml(m.product)}</div>
            ${promoHtml}
          </div>
          <div class="price-col num">
            <div>
              <span class="price-hero">₪${m.effective_unit_price.toFixed(2)}</span>
              <span class="price-unit">/ ${escapeHtml(m.unit)}</span>
            </div>
            <div class="price-sub">
              ${hasDiscount ? `<span class="price-strike">₪${m.unit_price.toFixed(2)}</span>` : ""}
              Shelf ₪${m.price.toFixed(2)}
            </div>
          </div>
        </div>
      `;
    }

    function renderCards() {
      const grid = document.getElementById("cardsGrid");
      const filtered = appData.items.filter(item => {
        if (state.category !== "All" && item.category !== state.category) return false;
        let matches = item.matches || [];
        if (state.walkOnly) {
          matches = matches.filter(m => getStoreMeta(m.short_store, m.store).isWalk);
        }
        if (matches.length === 0) return false;
        if (state.onlyDeals && !matches.some(m => m.promo && m.promo.promo_unit_price)) return false;
        if (state.onlyLows && !(item.trend && item.trend.is_low)) return false;
        if (state.search) {
          const inTitle = item.name.toLowerCase().includes(state.search);
          const inProducts = matches.some(m => m.product.toLowerCase().includes(state.search));
          if (!inTitle && !inProducts) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching items found. Try clearing a filter or search term.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        let matches = item.matches || [];
        if (state.walkOnly) {
          matches = matches.filter(m => getStoreMeta(m.short_store, m.store).isWalk);
        }
        const qty = state.basket[item.name] || 0;
        const isExpanded = !!state.expanded[item.name];
        const isLow = item.trend && item.trend.is_low;

        // Progressive disclosure: show #1 overall + cheapest walkable store (if different)
        let visibleMatches = [];
        let walkHighlightIdx = -1;
        if (isExpanded || matches.length <= 2) {
          visibleMatches = matches;
        } else {
          visibleMatches.push(matches[0]);
          const firstWalkIdx = matches.findIndex((m, i) => i > 0 && getStoreMeta(m.short_store, m.store).isWalk);
          if (firstWalkIdx !== -1 && matches[firstWalkIdx].short_store !== matches[0].short_store) {
            visibleMatches.push(matches[firstWalkIdx]);
            walkHighlightIdx = 1;
          } else {
            visibleMatches.push(matches[1]);
          }
        }

        const uniqueStores = new Set(matches.map(m => m.short_store || m.store)).size;

        return `
          <article class="card">
            <div class="card-header">
              <div class="card-title-group">
                <div class="card-cat">${escapeHtml(item.category)}</div>
                <div class="card-title">${escapeHtml(item.name)}</div>
              </div>
              <div class="card-badges">
                ${isLow ? `<span class="low-badge num">↓ ${item.trend.pct_below_avg}% · 30d Low</span>` : ""}
                <div class="stepper">
                  ${qty > 0 ? `
                    <button class="stepper-btn" onclick="changeQty('${escapeHtml(item.name).replace(/'/g, "\\'")}', -1)" aria-label="Decrease">−</button>
                    <span class="stepper-qty num">${qty}</span>
                    <button class="stepper-btn add-primary" onclick="changeQty('${escapeHtml(item.name).replace(/'/g, "\\'")}', 1)" aria-label="Increase">+</button>
                  ` : `
                    <button class="stepper-btn add-primary" onclick="changeQty('${escapeHtml(item.name).replace(/'/g, "\\'")}', 1)" aria-label="Add">+</button>
                  `}
                </div>
              </div>
            </div>

            <div class="matches-list">
              ${visibleMatches.map((m, idx) => renderMatchRow(m, idx, idx === 0, idx === walkHighlightIdx)).join("")}
            </div>

            ${matches.length > 2 ? `
              <button class="expand-btn" onclick="toggleExpand('${escapeHtml(item.name).replace(/'/g, "\\'")}')">
                ${isExpanded
                  ? "Show top picks ▲"
                  : `Compare all ${uniqueStores} stores (${matches.length} options) ▾`}
              </button>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    /* Smart Basket Logic */
    function openBasket() {
      document.getElementById("drawerBackdrop").classList.add("open");
      renderBasketDrawer();
    }

    function closeBasket() {
      document.getElementById("drawerBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "drawerBackdrop") closeBasket();
    }

    function setBasketMode(mode) {
      state.basketMode = mode;
      document.getElementById("modePlanBtn").classList.toggle("active", mode === "plan");
      document.getElementById("modeAisleBtn").classList.toggle("active", mode === "aisle");
      renderBasketDrawer();
    }

    function addCustomItem(e) {
      e.preventDefault();
      const nameEl = document.getElementById("customItemName");
      const priceEl = document.getElementById("customItemPrice");
      const name = nameEl.value.trim();
      if (!name) return;
      const price = parseFloat(priceEl.value) || 0;
      state.customItems.push({
        id: "c_" + Date.now(),
        name,
        price,
        qty: 1
      });
      nameEl.value = "";
      priceEl.value = "";
      saveState();
      updateBasketBadge();
      renderBasketDrawer();
    }

    function removeCustomItem(id) {
      state.customItems = state.customItems.filter(c => c.id !== id);
      delete state.checkedIds[id];
      saveState();
      updateBasketBadge();
      renderBasketDrawer();
    }

    function toggleChecked(key) {
      state.checkedIds[key] = !state.checkedIds[key];
      saveState();
      renderBasketDrawer();
    }

    function clearBasket() {
      state.basket = {};
      state.customItems = [];
      state.checkedIds = {};
      saveState();
      updateBasketBadge();
      renderCards();
      renderBasketDrawer();
    }

    function computeStoreSummaries() {
      const basketEntries = Object.entries(state.basket);
      const customTotal = state.customItems.reduce((sum, c) => sum + (c.price || 0) * (c.qty || 1), 0);

      // Build list of active stores that actually have data
      const activeStores = appData.stores.filter(s =>
        appData.items.some(it => (it.matches || []).some(m => m.store === s.label))
      );

      let splitTotal = customTotal;
      basketEntries.forEach(([itemName, qty]) => {
        const item = appData.items.find(i => i.name === itemName);
        if (!item || !item.matches.length) return;
        const best = item.matches[0];
        const unitShelf = (best.promo && best.promo.promo_unit_price && qty >= (best.promo.min_qty || 1))
          ? best.price * (best.promo.promo_unit_price / best.unit_price)
          : best.price;
        splitTotal += unitShelf * qty;
      });

      const summaries = activeStores.map(store => {
        let total = customTotal;
        let missing = 0;
        const lineItems = [];

        basketEntries.forEach(([itemName, qty]) => {
          const item = appData.items.find(i => i.name === itemName);
          if (!item) return;
          const storeMatches = (item.matches || []).filter(m => m.store === store.label);
          if (!storeMatches.length) {
            missing++;
            lineItems.push({ itemName, qty, match: null, lineCost: 0, promoApplied: false });
            return;
          }
          const best = storeMatches[0];
          const minQty = (best.promo && best.promo.min_qty) ? best.promo.min_qty : 1;
          const hasOpenPromo = !!(best.promo && best.promo.promo_unit_price);
          const promoApplied = hasOpenPromo && qty >= minQty;
          const effectiveShelf = promoApplied
            ? best.price * (best.promo.promo_unit_price / best.unit_price)
            : best.price;
          const lineCost = effectiveShelf * qty;
          total += lineCost;

          lineItems.push({
            itemName,
            qty,
            match: best,
            lineCost,
            promoApplied,
            hasOpenPromo,
            minQty,
            effectiveShelf
          });
        });

        return {
          store,
          total,
          missing,
          lineItems
        };
      }).sort((a, b) => (a.missing - b.missing) || (a.total - b.total));

      return { summaries, splitTotal, customTotal };
    }

    function renderBasketDrawer() {
      const body = document.getElementById("drawerBody");
      const basketEntries = Object.entries(state.basket);

      if (basketEntries.length === 0 && state.customItems.length === 0) {
        body.innerHTML = `<div class="empty-state">Your basket is empty.<br/>Tap <strong>+</strong> on any item card to build your list.</div>`;
        return;
      }

      const { summaries, splitTotal } = computeStoreSummaries();
      if (!summaries.length) {
        body.innerHTML = `<div class="empty-state">No store pricing loaded yet.</div>`;
        return;
      }

      if (!state.selectedStore || !summaries.some(s => s.store.label === state.selectedStore)) {
        state.selectedStore = summaries[0].store.label;
      }

      const activeSummary = summaries.find(s => s.store.label === state.selectedStore) || summaries[0];
      const cheapestOverall = summaries[0];
      const cheapestWalk = summaries.find(s => s.store.tier === "neighborhood");

      if (state.basketMode === "aisle") {
        // IN-AISLE CHECKLIST MODE
        const allRows = [
          ...activeSummary.lineItems.map(li => ({
            key: "staple:" + li.itemName,
            title: li.itemName,
            hebrew: li.match ? li.match.product : "Not stocked at this branch",
            qty: li.qty,
            cost: li.lineCost,
            promo: li.promoApplied ? li.match.promo.desc : ""
          })),
          ...state.customItems.map(c => ({
            key: c.id,
            title: c.name,
            hebrew: "Custom item",
            qty: c.qty || 1,
            cost: (c.price || 0) * (c.qty || 1),
            promo: ""
          }))
        ];

        const unchecked = allRows.filter(r => !state.checkedIds[r.key]);
        const checked = allRows.filter(r => state.checkedIds[r.key]);
        const sortedRows = [...unchecked, ...checked];
        const remainingCost = unchecked.reduce((sum, r) => sum + r.cost, 0);
        const pctDone = allRows.length ? Math.round((checked.length / allRows.length) * 100) : 0;

        body.innerHTML = `
          <div class="store-tabs">
            ${summaries.map(s => `
              <button class="store-tab ${s.store.label === activeSummary.store.label ? "active" : ""}"
                      onclick="state.selectedStore='${escapeHtml(s.store.label).replace(/'/g, "\\'")}'; renderBasketDrawer();">
                <div class="store-tab-name">${s.store.tier === "neighborhood" ? "🚶" : "🚗"} ${escapeHtml(s.store.short_name)}</div>
                <div class="store-tab-total num">₪${s.total.toFixed(0)}</div>
              </button>
            `).join("")}
          </div>

          <div class="aisle-progress">
            <div class="aisle-progress-top">
              <span>${checked.length} of ${allRows.length} items in cart</span>
              <span class="num" style="color: var(--brand);">Remaining: ₪${remainingCost.toFixed(2)}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${pctDone}%"></div>
            </div>
          </div>

          <div class="basket-list">
            ${sortedRows.map(r => {
              const isChecked = !!state.checkedIds[r.key];
              return `
                <div class="aisle-row ${isChecked ? "checked" : ""}" onclick="toggleChecked('${escapeHtml(r.key).replace(/'/g, "\\'")}')">
                  <div class="aisle-check">${isChecked ? "✓" : ""}</div>
                  <div class="basket-item-meta">
                    <div class="aisle-name basket-item-title">${r.qty}× ${escapeHtml(r.title)}</div>
                    <div class="basket-item-he">${escapeHtml(r.hebrew)}</div>
                    ${r.promo ? `<div class="promo-pill active-deal" style="margin-top:4px;">🏷️ ${escapeHtml(r.promo)}</div>` : ""}
                  </div>
                  <div class="num" style="font-weight:800; font-size:15px;">
                    ${r.cost > 0 ? `₪${r.cost.toFixed(2)}` : "—"}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
        return;
      }

      // PLAN AT HOME MODE
      let walkVsDriveHtml = "";
      if (cheapestWalk && cheapestOverall.store.tier === "big_box" && cheapestWalk.total > cheapestOverall.total + 1) {
        const diff = cheapestWalk.total - cheapestOverall.total;
        walkVsDriveHtml = `<div>🚗 Driving to <strong>${escapeHtml(cheapestOverall.store.short_name)}</strong> saves <span class="callout-highlight num">₪${diff.toFixed(2)}</span> vs walking to <strong>${escapeHtml(cheapestWalk.store.short_name)}</strong>.</div>`;
      } else if (cheapestWalk && cheapestWalk.store.label === cheapestOverall.store.label) {
        walkVsDriveHtml = `<div>🚶 <strong>${escapeHtml(cheapestWalk.store.short_name)}</strong> is both walkable and the cheapest single store!</div>`;
      }

      const splitSavings = activeSummary.total - splitTotal;
      const splitHtml = splitSavings > 3
        ? `<div>🔀 Splitting across stores drops total to <span class="callout-highlight num">₪${splitTotal.toFixed(2)}</span> (saves ₪${splitSavings.toFixed(2)}).</div>`
        : "";

      body.innerHTML = `
        <div class="store-tabs">
          ${summaries.map(s => `
            <button class="store-tab ${s.store.label === activeSummary.store.label ? "active" : ""}"
                    onclick="state.selectedStore='${escapeHtml(s.store.label).replace(/'/g, "\\'")}'; renderBasketDrawer();">
              <div class="store-tab-name">${s.store.tier === "neighborhood" ? "🚶" : "🚗"} ${escapeHtml(s.store.short_name)}</div>
              <div class="store-tab-total num">₪${s.total.toFixed(2)}</div>
            </button>
          `).join("")}
        </div>

        ${(walkVsDriveHtml || splitHtml) ? `<div class="callout-card">${walkVsDriveHtml}${splitHtml}</div>` : ""}

        <form class="custom-add-form" onsubmit="addCustomItem(event)">
          <input id="customItemName" class="custom-name-input" type="text" placeholder="Add extra item (e.g. Dish soap)..." />
          <input id="customItemPrice" class="custom-price-input num" type="number" step="0.5" min="0" placeholder="₪ Est." />
          <button type="submit" class="custom-add-btn">+ Add</button>
        </form>

        <div class="basket-list">
          ${activeSummary.lineItems.map(li => {
            const needMore = li.hasOpenPromo && li.qty < li.minQty;
            const addCount = Math.ceil(li.minQty - li.qty);
            const bundleCost = li.match ? (li.match.price * (li.match.promo.promo_unit_price / li.match.unit_price) * li.minQty) : 0;

            return `
              <div class="basket-row">
                <div class="basket-row-main">
                  <div class="basket-item-meta">
                    <div class="basket-item-title">${escapeHtml(li.itemName)}</div>
                    <div class="basket-item-he">${li.match ? escapeHtml(li.match.product) : "Not available at this store"}</div>
                  </div>
                  <div class="stepper">
                    <button class="stepper-btn" onclick="changeQty('${escapeHtml(li.itemName).replace(/'/g, "\\'")}', -1)">−</button>
                    <span class="stepper-qty num">${li.qty}</span>
                    <button class="stepper-btn add-primary" onclick="changeQty('${escapeHtml(li.itemName).replace(/'/g, "\\'")}', 1)">+</button>
                  </div>
                  <div class="num" style="min-width:64px; text-align:right; font-weight:800; font-size:15px;">
                    ${li.match ? `₪${li.lineCost.toFixed(2)}` : "—"}
                  </div>
                </div>

                ${needMore ? `
                  <button class="nudge-pill" onclick="setExactQty('${escapeHtml(li.itemName).replace(/'/g, "\\'")}', ${li.minQty})">
                    <span>🏷️ Add ${addCount} more to unlock: ${escapeHtml(li.match.promo.desc)}</span>
                    <span class="num">→ ₪${bundleCost.toFixed(2)}</span>
                  </button>
                ` : (li.promoApplied ? `
                  <div class="promo-pill active-deal">✓ Deal unlocked: ${escapeHtml(li.match.promo.desc)}</div>
                ` : "")}
              </div>
            `;
          }).join("")}

          ${state.customItems.map(c => `
            <div class="basket-row">
              <div class="basket-row-main">
                <div class="basket-item-meta">
                  <div class="basket-item-title">${escapeHtml(c.name)}</div>
                  <div style="font-size:11.5px; color:var(--ink-muted);">Custom item</div>
                </div>
                <div class="num" style="font-weight:800; font-size:14px;">
                  ${c.price > 0 ? `₪${(c.price * (c.qty || 1)).toFixed(2)}` : "Est. ₪0"}
                </div>
                <button class="icon-close" style="width:28px; height:28px; font-size:12px;" onclick="removeCustomItem('${escapeHtml(c.id)}')">✕</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function shareWhatsApp() {
      const { summaries } = computeStoreSummaries();
      const active = summaries.find(s => s.store.label === state.selectedStore) || summaries[0];
      if (!active) return;

      const lines = [`🛒 *SabiPricez List — ${active.store.short_name}*`, ""];
      active.lineItems.forEach(li => {
        if (li.match) {
          lines.push(`• ${li.qty}× ${li.itemName} (${li.match.product}) — ₪${li.lineCost.toFixed(2)}`);
        } else {
          lines.push(`• ${li.qty}× ${li.itemName}`);
        }
      });
      state.customItems.forEach(c => {
        lines.push(`• ${c.qty || 1}× ${c.name}${c.price > 0 ? ` — ₪${c.price.toFixed(2)}` : ""}`);
      });
      lines.push("", `*Estimated Total: ₪${active.total.toFixed(2)}*`);

      const url = `https://wa.me/?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    }

    async function init() {
      updateBasketBadge();
      try {
        const res = await fetch("data.json?t=" + Date.now());
        appData = await res.json();
        updateFreshness(appData.updated_at);
        renderCategories();
        renderCards();
      } catch (e) {
        document.getElementById("cardsGrid").innerHTML =
          `<div class="empty-state">Could not load <code>data.json</code>. Check your connection or run the price scraper.</div>`;
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    }

    init();
  </script>
</body>
</html>
